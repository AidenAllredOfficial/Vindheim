# Example deployment to Fly.io:  fly launch --copy-config  (then)  fly deploy
# One machine holds every room in memory, so keep a single always-on instance.
app = "vindheim"
primary_region = "iad"

[build]

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[mounts]
  source = "vindheim_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
